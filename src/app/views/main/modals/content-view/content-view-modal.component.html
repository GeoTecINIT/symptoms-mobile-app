<ng-container *ngIf="content$ | async as content; else loading">
  <SymCloseActionBar
    [title]="content.title"
    (close)="onClose()"
  ></SymCloseActionBar>

  <ScrollView (scroll)="onScroll($event)">
    <StackLayout (layoutChanged)="onContentRendered($event)">
      <Label class="subtitle" textWrap="true" [text]="content.subtitle"></Label>
      <Label class="body" textWrap="true" [text]="content.body"></Label>
      <SymVideoPlayer
        *ngIf="content.videoPath"
        #player
        [src]="content.videoPath"
        controls="true"
        height="200"
      ></SymVideoPlayer>
      <Image
        *ngIf="content.infographicPath"
        [src]="content.infographicPath"
        height="auto"
      ></Image>
    </StackLayout>
  </ScrollView>
</ng-container>

<ng-template #loading>
  <SymCloseActionBar
    title="Cargando..."
    (close)="onClose()"
  ></SymCloseActionBar>
  <ActivityIndicator busy="true"></ActivityIndicator>
</ng-template>
