<GridLayout rows="auto, *" columns="*, auto">
  <Label row="0" col="0" [text]="title"></Label>
  <StackLayout row="0" col="1">
    <SymPrimaryButton
      *ngIf="btnText"
      size="sm"
      class="button"
      [flat]="true"
      [margin]="0"
      [text]="btnText"
      [enabled]="btnActive"
      (tap)="onBtnTap()"
    ></SymPrimaryButton>
  </StackLayout>
  <StackLayout row="1" col="0" colSpan="2">
    <ng-content></ng-content>
  </StackLayout>
</GridLayout>
