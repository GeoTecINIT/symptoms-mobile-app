<div [ngSwitch]="progressStatus">
  <SymIdleProgress *ngSwitchCase="ProgressStatus.IDLE"></SymIdleProgress>
  <SymUnderExposure
    *ngSwitchCase="ProgressStatus.IN_PROGRESS"
  ></SymUnderExposure>
  <SymAwaitingPostExposureQuestions
    *ngSwitchCase="ProgressStatus.AWAITING_POST_EXPOSURE_QUESTIONS"
  ></SymAwaitingPostExposureQuestions>
  <SymIdleProgress *ngSwitchDefault></SymIdleProgress>
</div>
