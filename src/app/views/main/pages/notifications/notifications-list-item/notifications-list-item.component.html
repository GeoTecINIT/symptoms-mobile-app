<GridLayout rows="auto, auto" columns="*, auto">
  <Label
    row="0"
    col="0"
    class="title"
    [text]="notification.title"
    textWrap="true"
  ></Label>
  <Label row="0" col="1" class="age" [text]="notification.age"></Label>
  <Label
    row="1"
    class="body"
    [text]="notification.body"
    textWrap="true"
  ></Label>
</GridLayout>
